<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>turma</title>
      <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="form_styles.css">
</head>
<body>
   <form>
       <input type="hidden" id="turma_id">
       <fieldset>
           <legend>Cadastro de truma</legend>
            <label for="nome">Nome:</br><input id="nome" name="nome" type="text"></label></br>
            <label for="modulo">Módulo:</br><input id="modulo" name="modulo" type="text"></label></br>
            <label for="nao_semestre">Semestre:</br><input id="ano_semestre" name="ano_semestre" type="number"></label></br>
            <label for="turno">Turno:</br>
                <select id="turno" name="turno">
                    <option value="" disabled selected>Selecione</option>
                    <option value="M">Manhã</option>
                    <option value="T">Tarde</option>
                    <option value="N">Noite</option>
                </select>
            </label></br>
            <label for="sala">Sala:</br><input id="sala" name="sala" type="text"></label></br>
            <label for ="curso">Curso:</br><input id="curso" name="curso" type="text"></label>
        </fieldset> 
        <button type="button" id="botao_salvar" class="bot_salv">Salvar</button>
        <script src="./controller/turma.js"></script>
   </form>
</body>
</html>
