<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alnulo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form_styles.css">
</head>
<body>
     <form>
        <input type="hidden" id="consultaaluno_id">
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="matricula">Matricula:</br><input id="matricula" name="matricula" type="text"></label></br>
            <label for="nome">Nome:</br><input id="nome" name="nome" type="text"></label></br>
            <label for="sobrenome">Sobrenome:</br><input id="sobrenome" name="sobrenome" type="text"></label></br>
            <label for ="data_nascimento">Data de nascimento:</br><input id="data_nascimento" name="data_nascimento" type="date"></label></br>
            <label for="sexo">Sexo:</br>
                <select id="sexo" name="sexo">
                      <option value ="" disabled selected>Selecione</option>
                      <option value ="M">Masculino</option>
                      <option value ="F">Feminino</option>
                </select>
            </label></br>
            <label for="cpf">CPF:</br><input id="cpf" name="cpf" type="number" maxlength="11" placeholder="999.999.999-99"></label></br>
            <label for="situacao">Situação:</br>
                <select id="situacao" name="situacao">
                      <option value =""disabled selected>Selecione</option>
                      <option value ="ativo">Ativo</option>
                      <option value ="inativo">Inativo</option>
                      <option value ="afastado">Afastado</option>
                      <option value ="trancado">Trancado</option>
                      <option value ="concluido">Concluído</option>
                      <option value ="evadido">Evadido</option>
                </select>
        </fieldset>
        <fieldset>
            <legend>Contato</legend>    
            <label for="email">Email:</br><input id="email" name="email" type="text"></label></br>
            <label for="telefone">Telefone:</br><input id="telefone" name="telefone" type= "tel"></label></br>
        </fieldset>
        <fieldset> 
            <legend>Endereço</legend>   
            <label for="rua">Rua</br><input id="rua" name="rua" type="text"></label></br> 
            <label for="numero">Número</br><input id="numero" name="numero" type="number"></label></br> 
            <label for="complemento">Complemento</br><input id="complemento" name="-complemento" type="text"></label></br> 
            <label for="bairro">Bairro</br><input id="bairro" name="bairro" type="text"></label></br> 
            <label for="cidade">Cidade</br><input id="cidade" name="cidade" type="text"></label></br> 
            <label for="estado">Estado</br><input id="estado" name="estado" type="text"></label></br>         
            <label for="data_ingresso">Data de ingresso</br><input id="data_ingresso" name="data_ingresso" type="date"></label></br>         
        </fieldset>
        <button type="button" id="botao_salvar" class="bot_salv">Salvar</button>
     </form>
     <script src="./controller/aluno.js"></script>
</body>
</html>
