<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

<body>
   <div id="log">
       <h1>Faça seu login</h1>
       <label for="login">Usuario(email)</br><input id="login" type="text"></label></br>
       <label for="senha">Senha</br><input id="senha" type="password">
          <span class="olin" onclick="mostarSenha()">
             <i id="fih" class="fa-solid fa-eye"></i>
          </span>
       </label></br>
       </br> <button id="salv">Salvar</button>
       <a href="altera_senha_email.html" title="Editar" class="btn-link">Esqueci minha senha</a>
   </div>
   <script>
        function mostarSenha(){
           const oio = document.querySelector('.olin');
           const sen =document.getElementById('senha');
           const fah=document.getElementById('fih');
               if(sen.type==="password"){
                   sen.type="text"
                   fah.classList.remove('fa-eye'); 
                   fah.classList.add('fa-eye-slash');
                }
            else{
                sen.type="password";
                fah.classList.remove('fa-eye-slash');
                fah.classList.add('fa-eye')
            } 
        };
   </script> 
   <script src="./controller/usuario.js"></script>
